<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unique Boutique Owner</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.own{max-width:760px;margin:0 auto;padding-block:40px 72px}
.own h1{font-size:clamp(32px,6vw,44px);line-height:1.1;font-weight:700}
.own h1:focus{outline:none}
.own .sub{margin-top:10px;font-size:19px;color:var(--ink2)}
.two{display:flex;flex-wrap:wrap;gap:20px;margin-top:32px}
.two .btn{flex:1 1 280px;min-height:96px;font-size:22px;flex-direction:column;gap:6px;background:var(--bark);color:var(--cream)}
.two .btn small{font-size:15px;font-weight:500;color:#e9dfc9}
.two .btn.alt{background:var(--brass);color:var(--bark)}
.two .btn.alt small{color:var(--bark)}
fieldset{border:0;margin:26px 0 0;padding:0}
legend,label.l{display:block;font-weight:700;font-size:18px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:12px}
.opt{flex:1 1 220px;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border:2px solid #cdbf9f;background:#fffdf7;cursor:pointer;font-weight:700}
.opt input{width:22px;height:22px;accent-color:#7a4328}
.opt:has(input:checked){border-color:var(--bark);background:var(--paper2)}
.field{margin-top:26px}
.in{width:100%;min-height:52px;padding:10px 14px;border:2px solid #cdbf9f;background:#fffdf7;color:var(--ink);font:inherit;font-size:18px}
textarea.in{min-height:110px}
.hint{margin-top:6px;font-size:15px;color:var(--muted)}
.pick{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.pick img{width:110px;height:110px;object-fit:cover;border:1px solid var(--line)}
input[type=file]{font:inherit;font-size:16px;max-width:100%}
.err{margin-top:20px;padding:12px 16px;background:#f6e1d8;border:2px solid #b4553a;color:#5c1f0f;font-weight:700}
.steps{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.pvwrap{margin-top:28px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.pvwrap .card{width:min(100%,320px)}
.sl{display:grid;gap:18px;margin-top:26px}
.row3{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:14px;background:#fffdf7;border:1px solid var(--line)}
.row3 img{width:84px;height:84px;object-fit:cover;flex:none}
.row3 .tx{flex:1 1 200px;min-width:0}
.row3 .tx b{font-family:var(--display);font-size:20px;font-weight:500;line-height:1.25;display:block}
.row3 .btn{min-height:56px;font-size:18px;padding:0 24px}
.back{display:inline-block;margin-bottom:18px}
.note{margin-top:26px;padding:16px;background:var(--paper2);border-left:6px solid var(--brass-m)}
h2.s{margin-top:44px;font-size:26px;font-weight:700}
</style>
</head>
<body>
<div id="hdr"></div>
<main class="wrap own" id="app" aria-live="polite"></main>
<div id="ftr"></div>
<script src="site.js"></script>
<script>
UB.chrome('owner');
const app = document.getElementById('app');
const S = { view: 'home', kind: 'item', main: null, mainUrl: '', second: null, secondUrl: '', title: '', price: '', note: '', busy: false, err: '', last: null, confirm: '' };
let docs = [], assetsNs = null, canWrite = false, booted = false;
const E = UB.esc;

(async () => {
  await UB.ready;
  try { assetsNs = window.claude && window.claude.use ? await window.claude.use('assets') : null; } catch (e) { assetsNs = null; }
  canWrite = !!(UB.getDb() && assetsNs); booted = true; render();
})();
UB.subscribe((l) => { docs = l; if (booted && (S.view === 'home' || S.view === 'sold' || S.view === 'tidy')) render(true); });

async function shrink(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight, k = Math.min(1, 1400 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.82));
}
const items = () => docs.filter((d) => d.kind === 'item');
const thumb = (d) => '<img src="' + E(UB.src(d)) + '" alt="">';
const priceNorm = (p) => { p = (p || '').trim(); return p && /^\d+(\.\d{1,2})?$/.test(p) ? '$' + p : p; };
const draft = () => ({ id: 'draft', kind: S.kind, title: S.kind === 'scene' ? (S.title.trim() || 'In the shop') : S.title.trim(), note: S.kind === 'item' ? S.note.trim() : '', price: S.kind === 'item' ? priceNorm(S.price) : '', status: 'available', fit: 'cover', added: new Date().toISOString(), img2: S.secondUrl });

function render(keepFocus) {
  if (!booted) { app.innerHTML = '<p class="sub">Loading the owner tools.</p>'; return; }
  let h = '';
  if (!canWrite) {
    h = '<h1 tabindex="-1">Owner tools</h1><div class="note"><b>Only the shop owner can change the site.</b><p style="margin-top:8px">Open this page while signed in to the account that owns it. Everyone else can look around, but nothing here will save.</p></div><p style="margin-top:22px"><a class="link" href="index.html">&larr; Back to the site</a></p>';
  } else if (S.view === 'home') {
    const av = items().filter((d) => d.status !== 'sold').length, so = items().filter((d) => d.status === 'sold').length, sc = docs.filter((d) => d.kind === 'scene').length;
    h = '<h1 tabindex="-1">What would you like to do?</h1><p class="sub">Two big buttons. Everything you do here shows up on the website right away.</p>' +
      '<div class="two"><button class="btn big" type="button" data-act="add">Add an Item<small>Photo, price, then a preview</small></button>' +
      '<button class="btn big alt" type="button" data-act="sold">Mark Something Sold<small>' + av + ' on the shelf</small></button></div>' +
      '<p class="hint" style="margin-top:22px;font-size:16px">' + av + ' available &middot; ' + so + ' sold &middot; ' + sc + ' scenes in the magazine</p>' +
      '<p style="margin-top:14px"><button class="link" type="button" data-act="tidy" style="background:none;border:0;cursor:pointer;font-size:17px">Remove something from the site</button></p>';
  } else if (S.view === 'add') {
    const item = S.kind === 'item';
    h = '<button class="link back" type="button" data-act="home" style="background:none;border:0;cursor:pointer;font-size:17px">&larr; Back</button><h1 tabindex="-1">Add to the site</h1>' +
      '<fieldset><legend>What is this?</legend><div class="opts"><label class="opt"><input type="radio" name="kind" value="item"' + (item ? ' checked' : '') + '> A single item</label><label class="opt"><input type="radio" name="kind" value="scene"' + (!item ? ' checked' : '') + '> A scene in the shop</label></div></fieldset>' +
      '<div class="field"><label class="l" for="f1">Photo</label><div class="pick"><input id="f1" type="file" accept="image/*" data-file="main">' + (S.mainUrl ? '<img src="' + E(S.mainUrl) + '" alt="Your photo">' : '') + '</div></div>' +
      (item ? '<div class="field"><label class="l" for="f2">A second photo (optional)</label><div class="pick"><input id="f2" type="file" accept="image/*" data-file="second">' + (S.secondUrl ? '<img src="' + E(S.secondUrl) + '" alt="Your second photo">' : '') + '</div></div>' : '') +
      '<div class="field"><label class="l" for="t">' + (item ? 'What is it called?' : 'A few words for the home page (optional)') + '</label><input class="in" id="t" data-f="title" value="' + E(S.title) + '" autocomplete="off"></div>' +
      (item ? '<div class="field"><label class="l" for="p">Price (optional)</label><input class="in" id="p" data-f="price" value="' + E(S.price) + '" inputmode="decimal" autocomplete="off"><p class="hint">Leave it blank and the site says &ldquo;Ask in store.&rdquo;</p></div>' +
        '<div class="field"><label class="l" for="n">Tell people about it (optional)</label><textarea class="in" id="n" data-f="note">' + E(S.note) + '</textarea><p class="hint">Type it, or speak it with the microphone on your keyboard.</p></div>' : '') +
      (S.err ? '<div class="err" role="alert">' + E(S.err) + '</div>' : '') +
      '<div class="steps"><button class="btn brass big" type="button" data-act="preview">See the preview</button></div>';
  } else if (S.view === 'preview') {
    const d = draft(), item = S.kind === 'item';
    h = '<h1 tabindex="-1">Here is how it will look</h1><p class="sub">Check it over. Nothing is public until you press publish.</p><div class="pvwrap">' +
      (item ? UB.card(d, { preview: true, srcOverride: S.mainUrl }) : '<div class="pgbox" style="aspect-ratio:4/5"><div class="pg"><img class="full" src="' + E(S.mainUrl) + '" alt=""></div></div>') + '</div>' +
      (S.err ? '<div class="err" role="alert">' + E(S.err) + '</div>' : '') +
      '<div class="steps"><button class="btn brass big" type="button" data-act="publish"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Publishing...' : 'Looks good, publish') + '</button><button class="btn line big" type="button" data-act="edit" style="color:var(--ink)"' + (S.busy ? ' disabled' : '') + '>Go back and edit</button></div>';
  } else if (S.view === 'done') {
    const d = S.last;
    h = '<h1 tabindex="-1">Published.</h1><p class="sub">It is on the website now.</p>' +
      '<div class="field"><label class="l" for="cap">Want to post it on Facebook? Here is the caption.</label><textarea class="in" id="cap" readonly style="min-height:150px">' + E(UB.caption(d)) + '</textarea></div>' +
      '<div class="steps"><button class="btn dark big" type="button" data-act="copycap">Copy caption</button><a class="btn line big" style="color:var(--ink)" href="' + (d.kind === 'item' ? 'shop.html' : 'magazine.html') + '">See it on the site</a><button class="btn brass big" type="button" data-act="add">Add another</button></div>' +
      '<p style="margin-top:22px"><button class="link" type="button" data-act="home" style="background:none;border:0;cursor:pointer;font-size:17px">Done for now</button></p>';
  } else if (S.view === 'sold') {
    const av = items().filter((d) => d.status !== 'sold'), so = items().filter((d) => d.status === 'sold').sort((a, b) => String(b.soldAt || b.added).localeCompare(String(a.soldAt || a.added))).slice(0, 8);
    h = '<button class="link back" type="button" data-act="home" style="background:none;border:0;cursor:pointer;font-size:17px">&larr; Back</button><h1 tabindex="-1">Mark something sold</h1><p class="sub">Tap Sold next to the item. You can undo it right after.</p>' +
      (S.err ? '<div class="err" role="alert">' + E(S.err) + '</div>' : '') +
      '<div class="sl">' + (av.length ? av.map((d) => '<div class="row3">' + thumb(d) + '<div class="tx"><b>' + E(d.title) + '</b><span class="muted">' + E(UB.priceText(d)) + '</span></div><button class="btn dark" type="button" data-act="sell" data-id="' + E(d.id) + '">Sold</button></div>').join('') : '<p class="sub">Nothing is waiting on the shelf. Add an item to see it here.</p>') + '</div>' +
      (so.length ? '<h2 class="s">Recently sold</h2><div class="sl">' + so.map((d) => '<div class="row3">' + thumb(d) + '<div class="tx"><b>' + E(d.title) + '</b><span class="muted">Sold</span></div><button class="btn line" style="color:var(--ink)" type="button" data-act="unsell" data-id="' + E(d.id) + '">Put back on the shelf</button></div>').join('') + '</div>' : '');
  } else if (S.view === 'tidy') {
    h = '<button class="link back" type="button" data-act="home" style="background:none;border:0;cursor:pointer;font-size:17px">&larr; Back</button><h1 tabindex="-1">Remove something</h1><p class="sub">This takes it off the website for good. Use it for mistakes.</p>' +
      (S.err ? '<div class="err" role="alert">' + E(S.err) + '</div>' : '') +
      '<div class="sl">' + docs.map((d) => '<div class="row3">' + thumb(d) + '<div class="tx"><b>' + E(d.title) + '</b><span class="muted">' + (d.kind === 'scene' ? 'Scene in the magazine' : 'Item in the shop') + '</span></div>' +
        (S.confirm === d.id ? '<span style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn dark" type="button" data-act="remove" data-id="' + E(d.id) + '">Yes, remove</button><button class="btn line" style="color:var(--ink)" type="button" data-act="keep">Keep it</button></span>' : '<button class="btn line" style="color:var(--ink)" type="button" data-act="ask" data-id="' + E(d.id) + '">Remove</button>') + '</div>').join('') + '</div>';
  }
  app.innerHTML = h;
  if (!keepFocus) { const f = app.querySelector('h1'); if (f) f.focus({ preventScroll: true }); }
}

async function dbDo(fn) {
  S.err = '';
  try { await fn(); return true; }
  catch (e) { S.err = 'That did not save' + (e && e.message ? ' (' + e.message + ')' : '') + '. Please try again.'; return false; }
}
function ref(id) { return UB.getDb().doc('items/' + id); }

app.addEventListener('input', (e) => { const f = e.target.dataset && e.target.dataset.f; if (f) S[f] = e.target.value; });
app.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.name === 'kind') { S.kind = t.value; render(true); return; }
  if (t.dataset && t.dataset.file && t.files && t.files[0]) {
    const which = t.dataset.file;
    try {
      const b = await shrink(t.files[0]);
      if (which === 'main') { S.main = b; S.mainUrl = URL.createObjectURL(b); } else { S.second = b; S.secondUrl = URL.createObjectURL(b); }
      S.err = '';
    } catch (er) { S.err = 'That photo could not be read. Try a different one.'; }
    render(true);
  }
});
app.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'home') { S.view = 'home'; S.err = ''; S.confirm = ''; render(); }
  else if (act === 'add') { Object.assign(S, { view: 'add', kind: 'item', main: null, mainUrl: '', second: null, secondUrl: '', title: '', price: '', note: '', err: '' }); render(); }
  else if (act === 'edit') { S.view = 'add'; S.err = ''; render(); }
  else if (act === 'sold' || act === 'tidy') { S.view = act; S.err = ''; S.confirm = ''; render(); }
  else if (act === 'preview') {
    if (!S.main) { S.err = 'Please choose a photo first.'; render(true); return; }
    if (S.kind === 'item' && !S.title.trim()) { S.err = 'Please give the item a name.'; render(true); return; }
    S.err = ''; S.view = 'preview'; render();
  } else if (act === 'publish') {
    S.busy = true; S.err = ''; render(true);
    try {
      const a = await assetsNs.upload(S.main, { type: 'image/jpeg' });
      const doc = draft(); delete doc.id; delete doc.img2; doc.imgId = a.id;
      if (S.kind === 'item' && S.second) { const a2 = await assetsNs.upload(S.second, { type: 'image/jpeg' }); doc.imgId2 = a2.id; }
      const r = await UB.getDb().collection('items').add(doc);
      S.last = Object.assign({ id: r.id }, doc); S.view = 'done';
    } catch (er) { S.err = 'The photo or item did not save' + (er && er.message ? ' (' + er.message + ')' : '') + '. Your work is still here. Please press publish again.'; }
    S.busy = false; render();
  } else if (act === 'copycap') { UB.copy(document.getElementById('cap').value, document.getElementById('cap')); }
  else if (act === 'sell') {
    const d = docs.find((x) => x.id === id); if (!d) return;
    if (await dbDo(() => ref(id).update({ status: 'sold', soldAt: new Date().toISOString() }))) UB.toast('Marked sold: ' + d.title, { label: 'Undo', run: async () => { await dbDo(() => ref(id).update({ status: 'available' })); render(true); } });
    render(true);
  } else if (act === 'unsell') { await dbDo(() => ref(id).update({ status: 'available' })); render(true); }
  else if (act === 'ask') { S.confirm = id; render(true); }
  else if (act === 'keep') { S.confirm = ''; render(true); }
  else if (act === 'remove') { S.confirm = ''; await dbDo(() => ref(id).delete()); render(true); }
});
</script>
</body>
</html>
